name: CI

# A pull request commit runs once: pushes are built only on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to a commit, not to a tag that could be moved; the comment
# names the release and Dependabot keeps both up to date.
# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Check source file length
        run: python ../scripts/check_file_length.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: UI is served with its security headers
        run: |
          # Nginx may still be starting: retry until it accepts connections.
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            "$BASE_URL/" | grep -q "Reconcile Core Engine"
          curl --silent --head "$BASE_URL/" | grep -i "^content-security-policy:"
      - name: API answers through the proxy
        run: curl --fail --silent --show-error "$BASE_URL/api/v1/health" | grep -q '"status":"ok"'
      - name: Scenario injection round trip
        run: |
          curl --fail --silent --show-error -X POST "$BASE_URL/api/v1/reconcile/inject/SCN-301" > /dev/null
          curl --fail --silent --show-error "$BASE_URL/api/v1/batches/current" | grep -q '"anomaly_type":"WITHHOLDING_GAP"'
      - name: Live run reaches the client through Nginx without buffering
        run: |
          curl --fail --silent --show-error --no-buffer --max-time 20 \
            "$BASE_URL/api/v1/stream?max_events=4" > stream.txt &
          stream_pid=$!
          sleep 2
          curl --fail --silent --show-error -X POST "$BASE_URL/api/v1/reconcile/run" > /dev/null
          # Fails the step if the stream client itself failed or timed out.
          wait "$stream_pid"
          grep -q "^event: snapshot" stream.txt
          grep -q "^event: reconciliation_progress" stream.txt
      - name: Audit pack download and template verification
        run: |
          curl --fail --silent --show-error -o pack.xlsx "$BASE_URL/api/v1/export/excel"
          curl --fail --silent --show-error -X POST --data-binary @pack.xlsx \
            -H "Content-Type: application/octet-stream" \
            "$BASE_URL/api/v1/template/verify" | grep -q '"valid":true'
      - name: Containers do not run as root
        run: |
          # Positive checks: an exec that fails prints nothing and must not pass.
          backend_uid="$(docker compose exec -T backend id -u)"
          frontend_uid="$(docker compose exec -T frontend id -u)"
          test "$backend_uid" = "10001"
          test -n "$frontend_uid"
          test "$frontend_uid" != "0"
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
