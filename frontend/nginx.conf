server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Workbook uploads are limited to 2 MB by the backend, which also explains the
    # refusal. This slightly higher ceiling lets that answer reach the user.
    client_max_body_size 3m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. They are declared only at server level on purpose:
    # an add_header inside a location would discard all of these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API and Server-Sent Events, proxied to the backend on the internal network.
    location /api/ {
        # Resolve the backend name through Docker's DNS on each lookup instead
        # of once at start-up. Otherwise a restarted backend with a new address
        # would leave every API call failing until Nginx itself restarts.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # SSE must reach the browser immediately: no buffering, no caching.
        proxy_buffering off;
        proxy_cache off;
        # Events are passed through as they arrive; the stream ends when the
        # connection closes instead of being re-framed in chunks.
        chunked_transfer_encoding off;

        # Applies to every proxied request in this location: ordinary API calls
        # and the stream. The stream receives an event or heartbeat at least
        # every 5 s, so 60 s (also the Nginx default) is a wide margin that only
        # closes a connection whose backend has really stopped answering.
        proxy_read_timeout 60s;
    }

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Single-page application fallback.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
